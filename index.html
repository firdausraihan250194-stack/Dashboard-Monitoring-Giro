<!-- Script Application -->
    <script>
        lucide.createIcons();

        // URL CSV Google Sheets (Giro & AR)
        const GIRO_CSV_URL = 'https://docs.google.com/spreadsheets/d/1blmL1pawujNDj_QVtnk7d7hq-U8LrAeEAfngdIzAyXE/export?format=csv&gid=0';
        const AR_CSV_URL   = 'https://docs.google.com/spreadsheets/d/1blmL1pawujNDj_QVtnk7d7hq-U8LrAeEAfngdIzAyXE/export?format=csv&gid=471745175';

        let giroData = [];
        let arDataList = [];
        let customerAoMap = {}; 
        let customerStatusMap = {}; 
        
        let bankChartInstance = null;
        let reasonChartInstance = null;

        async function fetchAllSheetData() {
            try {
                const [giroRes, arRes] = await Promise.all([
                    fetch(GIRO_CSV_URL),
                    fetch(AR_CSV_URL)
                ]);

                const giroText = await giroRes.text();
                const arText   = await arRes.text();

                parseARData(arText);
                giroData = parseCSV(giroText);

                initDashboard();
            } catch (err) {
                console.error("Gagal memuat data Google Sheets:", err);
            }
        }

        // Membersihkan nama dari PT/CV dan simbol
        function cleanName(str) {
            if (!str) return '';
            return str.replace(/PT\s+/gi, '').replace(/CV\s+/gi, '').replace(/[^a-zA-Z0-9\s]/g, '').trim().toUpperCase();
        }

        // Standarisasi nilai agar angka kosong/strip (-) berubah menjadi 0
        function sanitizeNumber(val) {
            if (!val || val === '-' || val === ' - ' || val.toString().trim() === '') return '0';
            const cleanVal = val.toString().replace(/[^0-9.-]+/g, "").trim();
            return cleanVal === '' ? '0' : cleanVal;
        }

        function parseARData(csvText) {
            arDataList = parseCSV(csvText);
            arDataList.forEach(r => {
                const rawName = r['NAMA_CUSTOMER'];
                const cleaned = cleanName(rawName);
                const ao   = r['USER_AO'] || '-';
                const status = r['CONTRACT_STATUS'] || '-';

                if (cleaned) {
                    if (ao && ao !== '-') customerAoMap[cleaned] = ao;
                    if (status && status !== '-') customerStatusMap[cleaned] = status;
                }
            });
        }

        // Logika Fuzzy Matching yang Ditingkatkan (Mengatasi MENDAYU vs MEDAYU)
        function getCustomerARInfo(rawGiroName, sampleGiroItem) {
            const cleanedGiro = cleanName(rawGiroName);
            
            // 1. Coba Match Persis
            let arMatch = arDataList.find(item => cleanName(item['NAMA_CUSTOMER']) === cleanedGiro);

            // 2. Fuzzy Match (Ambil kata kunci pertama dan kata kedua)
            if (!arMatch) {
                const words = cleanedGiro.split(/\s+/).filter(w => w.length >= 3);
                if (words.length >= 1) {
                    const firstWord = words[0]; // Misal: BARANA
                    arMatch = arDataList.find(item => {
                        const arClean = cleanName(item['NAMA_CUSTOMER']);
                        return arClean.includes(firstWord);
                    });
                }
            }

            // Ambil data dan terapkan penyetaraan ke '0' untuk angka strip/kosong
            const instKe = sanitizeNumber(arMatch ? arMatch['INST_KE'] : (sampleGiroItem['Inst_Ke'] || sampleGiroItem['Inst_ke']));
            const schKe = sanitizeNumber(arMatch ? arMatch['SCH_KE'] : (sampleGiroItem['Sch_Ke'] || sampleGiroItem['Sch_ke']));
            const ovdDays = sanitizeNumber(arMatch ? (arMatch['OVD_DAYS'] || arMatch[' OVD_DAYS ']) : sampleGiroItem['Ovd_Days']);
            const ovdAmount = sanitizeNumber(arMatch ? (arMatch['OVERDUE_AMOUNT'] || arMatch[' OVERDUE_AMOUNT ']) : '0');
            const status = arMatch ? (arMatch['CONTRACT_STATUS'] || 'AC') : 'AC';
            const userAo = arMatch ? (arMatch['USER_AO'] || '-') : (customerAoMap[cleanedGiro] || '-');

            return {
                userAo: (userAo === '' || userAo === null) ? '-' : userAo,
                status,
                instKe,
                schKe,
                ovdDays,
                ovdAmount
            };
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"\vert{}"$/g, ''));
                let obj = {};
                headers.forEach((h, i) => {
                    obj[h] = values[i] || '';
                });
                return obj;
            });
        }

        function initDashboard() {
            document.getElementById('filterContractStatus').addEventListener('change', updateDashboard);
            document.getElementById('filterTahun').addEventListener('change', updateDashboard);
            document.getElementById('filterBulan').addEventListener('change', updateDashboard);
            document.getElementById('searchHistory').addEventListener('input', renderHistoryTable);

            updateDashboard();
        }

        function getFilteredData() {
            const statusFilter = document.getElementById('filterContractStatus').value;
            const tahunFilter  = document.getElementById('filterTahun').value;
            const bulanFilter  = document.getElementById('filterBulan').value;

            return giroData.filter(item => {
                const info = getCustomerARInfo(item['Atas Nama Rekening'], item);
                const tglPDC = new Date(item['Tgl PDC']);
                if (isNaN(tglPDC)) return false;

                const matchStatus = (statusFilter === 'ALL') || (info.status.toUpperCase() === statusFilter.toUpperCase());
                const matchTahun  = (tahunFilter === 'ALL')  || (tglPDC.getFullYear().toString() === tahunFilter);
                const matchBulan  = (bulanFilter === 'ALL')  || (tglPDC.getMonth().toString() === bulanFilter);

                return matchStatus && matchTahun && matchBulan;
            });
        }

        function updateDashboard() {
            const data = getFilteredData();
            renderBankChart3D(data);
            renderReasonChart3D(data);
            renderTopCustomerTable(data);
            renderHistoryTable();
        }

        function renderBankChart3D(data) {
            const bankCounts = {};
            data.forEach(d => {
                const bank = d['Nama Bank'] || 'Lainnya';
                bankCounts[bank] = (bankCounts[bank] || 0) + 1;
            });

            const sortedBanks = Object.entries(bankCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);

            if (bankChartInstance) bankChartInstance.destroy();

            const ctx = document.getElementById('bankChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, '#818cf8');
            gradient.addColorStop(0.5, '#4338ca');
            gradient.addColorStop(1, '#1e1b4b');

            bankChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedBanks.map(b => b[0]),
                    datasets: [{
                        label: 'Frekuensi Tolakan',
                        data: sortedBanks.map(b => b[1]),
                        backgroundColor: gradient,
                        borderColor: '#a5b4fc',
                        borderWidth: 1.5,
                        borderRadius: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            color: '#e2e8f0',
                            font: { weight: 'bold', size: 11 }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { weight: '600' } }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51, 65, 85, 0.4)' } }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        function renderReasonChart3D(data) {
            let danaTdkCukup = 0;
            let asuransiSpecial = 0;
            let alasanLainnya = 0;

            data.forEach(d => {
                const ket = (d['Keterangan'] || '').toLowerCase();
                if (ket.includes('dana tdk cukup') || ket.includes('dana tidak cukup')) {
                    danaTdkCukup++;
                } else if (ket.includes('asuransi')) {
                    asuransiSpecial++;
                } else {
                    alasanLainnya++;
                }
            });

            if (reasonChartInstance) reasonChartInstance.destroy();

            const ctx = document.getElementById('reasonChart').getContext('2d');

            reasonChartInstance = new Chart(ctx, {
                type: 'doughnut',
                plugins: [ChartDataLabels],
                data: {
                    labels: ['Dana Tidak Cukup', 'Asuransi / Tolakan Khusus', 'Alasan Lainnya'],
                    datasets: [{
                        data: [danaTdkCukup, asuransiSpecial, alasanLainnya],
                        backgroundColor: ['#f43f5e', '#f59e0b', '#3b82f6'],
                        hoverBackgroundColor: ['#fb7185', '#fbbf24', '#60a5fa'],
                        borderColor: '#0f172a',
                        borderWidth: 3,
                        hoverOffset: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { 
                            position: 'bottom', 
                            labels: { color: '#cbd5e1', font: { size: 11, weight: '500' }, padding: 16 } 
                        },
                        datalabels: {
                            color: '#ffffff',
                            font: { weight: 'bold', size: 12 },
                            formatter: (value, ctx) => {
                                let sum = 0;
                                let dataArr = ctx.chart.data.datasets[0].data;
                                dataArr.map(d => { sum += d; });
                                if (sum === 0) return '0%';
                                return ((value * 100) / sum).toFixed(1) + "%";
                            }
                        }
                    }
                }
            });
        }

        function formatCurrency(val) {
            const num = parseFloat(val);
            if (isNaN(num) || num === 0) return 'Rp 0';
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        function renderTopCustomerTable(data) {
            const customerMap = {};

            data.forEach(d => {
                const rawName = d['Atas Nama Rekening'];
                if (!rawName) return;

                if (!customerMap[rawName]) {
                    customerMap[rawName] = { name: rawName, count: 0, items: [] };
                }

                customerMap[rawName].count += 1;
                customerMap[rawName].items.push(d);
            });

            let topCustomers = Object.values(customerMap);
            topCustomers.sort((a, b) => b.count - a.count);
            topCustomers = topCustomers.slice(0, 10);

            const tbody = document.getElementById('tableCustomerBody');
            tbody.innerHTML = '';

            if (topCustomers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-6 text-slate-500">Tidak ada data customer untuk filter ini.</td></tr>`;
                return;
            }

            topCustomers.forEach(c => {
                const sampleItem = c.items[0];
                const info = getCustomerARInfo(c.name, sampleItem);

                const sortedItems = c.items.sort((a, b) => new Date(b['Tgl PDC']) - new Date(a['Tgl PDC'])).slice(0, 3);
                
                const datesInfo = sortedItems.map(item => 
                    `<div class="text-[11px] mb-1"><span class="text-slate-400">PDC:</span> ${item['Tgl PDC']} | <span class="text-rose-400">Tolakan:</span> ${item['Tgl Tolakan']}</div>`
                ).join('');

                const reason = sortedItems[0]['Keterangan'] || '-';

                let statusBadge = `<span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded text-[10px] font-bold">${info.status}</span>`;
                if (info.status === 'PT') statusBadge = `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded text-[10px] font-bold">PT</span>`;
                if (info.status === 'CL') statusBadge = `<span class="bg-slate-500/20 text-slate-300 border border-slate-500/30 px-2 py-0.5 rounded text-[10px] font-bold">CL</span>`;
                if (info.status === 'RP') statusBadge = `<span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded text-[10px] font-bold">RP</span>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/60 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-3 font-semibold text-white text-xs">${c.name}</td>
                    <td class="py-3 px-3 font-medium text-indigo-300 text-xs">${info.userAo}</td>
                    <td class="py-3 px-2 text-center">${statusBadge}</td>
                    <td class="py-3 px-2 text-center">
                        <span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-0.5 rounded-full text-xs font-bold">${c.count}x</span>
                    </td>
                    <td class="py-3 px-2 text-center font-mono text-slate-300 text-xs">${info.instKe}</td>
                    <td class="py-3 px-2 text-center font-mono text-slate-300 text-xs">${info.schKe}</td>
                    <td class="py-3 px-2 text-center font-mono text-amber-400 text-xs font-semibold">${info.ovdDays}</td>
                    <td class="py-3 px-3 text-right font-mono text-emerald-400 text-xs font-semibold">${formatCurrency(info.ovdAmount)}</td>
                    <td class="py-3 px-3">${datesInfo}</td>
                    <td class="py-3 px-3 text-slate-300 text-xs">${reason}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderHistoryTable() {
            const data = getFilteredData();
            const keyword = document.getElementById('searchHistory').value.toLowerCase();

            const filteredHistory = data.filter(item => {
                const info = getCustomerARInfo(item['Atas Nama Rekening'], item);
                const searchStr = `${item['No PDC']} ${item['Atas Nama Rekening']} ${info.userAo} ${item['Nama Bank']} ${item['Keterangan']}`.toLowerCase();
                return searchStr.includes(keyword);
            });

            const tbody = document.getElementById('tableHistoryBody');
            tbody.innerHTML = '';

            if (filteredHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-500">Data history tidak ditemukan.</td></tr>`;
                return;
            }

            filteredHistory.forEach(item => {
                const info = getCustomerARInfo(item['Atas Nama Rekening'], item);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-mono text-indigo-300">${item['No PDC'] || '-'}</td>
                    <td class="py-2.5 px-4 font-medium text-white">${item['Atas Nama Rekening'] || '-'}</td>
                    <td class="py-2.5 px-4 font-medium text-indigo-400">${info.userAo}</td>
                    <td class="py-2.5 px-4 text-slate-300">${item['Nama Bank'] || '-'}</td>
                    <td class="py-2.5 px-4 text-right font-mono text-emerald-400">${item[' Nominal PDC '] || item['Nominal PDC'] || '-'}</td>
                    <td class="py-2.5 px-4 text-slate-300">${item['Tgl PDC'] || '-'}</td>
                    <td class="py-2.5 px-4 text-rose-300">${item['Tgl Tolakan'] || '-'}</td>
                    <td class="py-2.5 px-4 text-slate-400">${item['Keterangan'] || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        fetchAllSheetData();
    </script>
